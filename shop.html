<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique | Pipodi Store</title>
    <meta name="description" content="Tous les produits Pipodi Store : chaussures, vêtements, accessoires et électronique, livrés partout en Haïti." />
    <meta name="theme-color" content="#0b4a5e" />
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" referrerpolicy="no-referrer" />
    <script>
      // Applique le thème (clair/sombre) avant l'affichage pour éviter un flash
      (function () {
        var t = null;
        try { t = JSON.parse(localStorage.getItem("pipodi-theme")); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="shop">
    <header id="site-header"></header>

    <main>
      <section class="section container shop-section">
        <div class="section-head">
          <div>
            <span class="eyebrow">Boutique</span>
            <h2>Trouvez votre prochain coup de cœur</h2>
          </div>
        </div>
        <div class="shop-toolbar">
          <div class="chips" id="filter-chips"></div>
          <div class="shop-controls">
            <label class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="search" id="search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit" />
            </label>
            <select id="sort" class="select" aria-label="Trier">
              <option value="default">Trier : recommandés</option>
              <option value="price-asc">Prix croissant</option>
              <option value="price-desc">Prix décroissant</option>
            </select>
          </div>
        </div>
        <p class="result-count" id="result-count"></p>
        <div class="product-grid" id="shop-grid"></div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="products.js"></script>
    <script src="script.js"></script>
  </body>
</html>
