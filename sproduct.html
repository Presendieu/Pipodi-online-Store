<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produit | Pipodi Store</title>
    <meta name="theme-color" content="#0b4a5e" />
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" referrerpolicy="no-referrer" />
    <script>
      // Applique le thème (clair/sombre) avant l'affichage pour éviter un flash
      (function () {
        var t = null;
        try { t = JSON.parse(localStorage.getItem("pipodi-theme")); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="shop">
    <header id="site-header"></header>

    <main>
      <section class="section container">
        <div class="product-detail" id="product-detail"></div>
      </section>

      <section class="section section-soft">
        <div class="container">
          <div class="section-head">
            <div>
              <span class="eyebrow">Vous aimerez aussi</span>
              <h2>Produits similaires</h2>
            </div>
            <a href="shop.html" class="link-arrow">Voir la boutique <i class="fa-solid fa-arrow-right"></i></a>
          </div>
          <div class="product-grid product-row" data-products="related" data-limit="4"></div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="products.js"></script>
    <script src="script.js"></script>
  </body>
</html>
